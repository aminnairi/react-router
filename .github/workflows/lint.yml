name: Lint

on: [push]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.7.0
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm -w packages/react-router run lint

      - name: Build
        run: npm -w packages/react-router run build
